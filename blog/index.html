<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily — Pavan Bodanki</title>
    <meta name="description" content="Pavan Bodanki reads something about AI every day and posts his take.">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="../theme.css">
    <style>
        .container { max-width: 880px; margin-top: 30px; margin-bottom: 60px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .topbar a {
            font-family: 'Space Grotesk', sans-serif; padding: 6px 16px; border-radius: 999px;
            border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(12px);
        }
        .blog-hero h1 {
            font-size: clamp(2.4rem, 6vw, 3.6rem); background: var(--grad); background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite;
            margin: 0.4em 0 0.1em;
        }
        .blog-hero .lead { color: var(--muted); }
        .kicker { font-family: 'JetBrains Mono', monospace; color: var(--cyan); font-size: 0.85rem; letter-spacing: 0.08em; }
        .post-card {
            display: block; color: inherit; text-decoration: none !important; padding: 24px 28px; margin: 20px 0;
            background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); border-radius: 20px; position: relative; overflow: hidden;
            transition: transform .3s, box-shadow .3s, border-color .3s;
        }
        .post-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--grad); opacity: .7; }
        .post-card:hover { transform: translateY(-4px); border-color: rgba(34,211,238,.45); box-shadow: var(--glow); color: inherit; text-shadow: none; }
        .post-card h3 { margin: 4px 0 8px; color: #fff !important; }
        .post-card p { color: var(--text); }
        .meta { color: var(--muted); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; }
        .tag {
            display: inline-block; border: 1px solid rgba(167,139,250,.5); background: rgba(167,139,250,.1); color: var(--violet);
            border-radius: 999px; padding: 1px 10px; font-size: 0.75rem; margin: 2px 4px 2px 0; font-family: 'JetBrains Mono', monospace;
        }
        a.tag:hover { color: #fff; border-color: var(--cyan); }
        .tag.active { background: var(--grad); color: #05070f; border-color: transparent; }
        #search {
            max-width: 280px; background: rgba(10,14,30,.6); border: 1px solid var(--glass-border); color: var(--text); border-radius: 999px;
        }
        #search:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.2); background: rgba(10,14,30,.8); color: #fff; }
        article.post {
            background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); border-radius: 22px; padding: 40px clamp(20px, 5vw, 48px); margin-top: 20px;
        }
        article.post > h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.25; margin: .3em 0 .5em; }
        .source-box {
            background: rgba(34,211,238,.06); border: 1px solid rgba(34,211,238,.25); border-left: 3px solid var(--cyan);
            padding: 12px 18px; border-radius: 10px; margin: 18px 0 28px;
        }
        .post-body { font-size: 1.05rem; }
        .post-body h2 { margin-top: 1.8em; font-size: 1.55rem; display: block; width: fit-content; }
        .post-body blockquote {
            border-left: 3px solid var(--violet); background: rgba(167,139,250,.07); padding: 12px 18px; border-radius: 0 10px 10px 0;
            color: #e9e5ff; font-style: italic; margin: 1.2em 0;
        }
        .post-body table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1.2em 0 1.6em; border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; }
        .post-body th, .post-body td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid rgba(120,160,255,.1); }
        .post-body th { background: rgba(34,211,238,.12); color: #fff; font-family: 'Space Grotesk', sans-serif; }
        .post-body tr:last-child td { border-bottom: none; }
        .post-body tr:hover td { background: rgba(120,160,255,.05); }
        .post-body code { color: var(--pink); background: rgba(244,114,182,.08); padding: 1px 6px; border-radius: 4px; }
        .post-body pre { background: rgba(5,7,15,.8); border: 1px solid var(--glass-border); padding: 14px; border-radius: 10px; }
        .post-body img { max-width: 100%; border-radius: 12px; }
        .post-body li::marker { color: var(--cyan); }
        .post-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>

<body>
    <div class="container">
        <div class="topbar">
            <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
            <a href="./" id="all-posts-link" style="display:none">All posts</a>
        </div>
        <div id="app"><p class="meta">Loading…</p></div>
    </div>

    <script>
        const app = document.getElementById('app');
        const params = new URLSearchParams(location.search);
        const slug = params.get('post');
        const tagFilter = params.get('tag');

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        const tagsHtml = tags => (tags || []).map(t =>
            `<a class="tag ${t === tagFilter ? 'active' : ''}" href="?tag=${encodeURIComponent(t)}">${esc(t)}</a>`).join('');

        async function loadPosts() {
            const res = await fetch('posts.json', { cache: 'no-cache' });
            const posts = await res.json();
            return posts.sort((a, b) => b.date.localeCompare(a.date));
        }

        function renderList(posts) {
            document.title = 'AI Daily — Pavan Bodanki';
            const filtered = tagFilter ? posts.filter(p => (p.tags || []).includes(tagFilter)) : posts;
            app.innerHTML = `
                <div class="blog-hero"><div class="kicker">// PAVAN BODANKI · BLOG</div><h1>AI Daily</h1>
                <p class="lead">Every day I read something about AI — a paper, a release, an article — and post my take.</p></div>
                <div class="d-flex justify-content-between align-items-center flex-wrap" style="gap:10px">
                    <span class="meta">${filtered.length} post${filtered.length === 1 ? '' : 's'}${tagFilter ? ` tagged <b>${esc(tagFilter)}</b> · <a href="./">clear</a>` : ''}</span>
                    <input id="search" class="form-control form-control-sm" placeholder="Search posts…">
                </div>
                <div id="list"></div>`;
            const list = document.getElementById('list');
            const draw = q => {
                q = q.toLowerCase();
                const items = filtered.filter(p =>
                    !q || [p.title, p.summary, p.source?.title, ...(p.tags || [])].join(' ').toLowerCase().includes(q));
                list.innerHTML = items.length ? items.map(p => `
                    <a class="post-card" href="?post=${encodeURIComponent(p.slug)}">
                        <div class="meta">${fmtDate(p.date)}${p.source?.title ? ` · Read: ${esc(p.source.title)}` : ''}</div>
                        <h3>${esc(p.title)}</h3>
                        <p class="mb-2">${esc(p.summary)}</p>
                        <div>${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
                    </a>`).join('') : '<p class="meta mt-4">No posts found.</p>';
            };
            document.getElementById('search').addEventListener('input', e => draw(e.target.value));
            draw('');
            window.revealCards && window.revealCards();
        }

        async function renderPost(posts) {
            document.getElementById('all-posts-link').style.display = '';
            const idx = posts.findIndex(p => p.slug === slug);
            if (idx === -1) {
                app.innerHTML = '<h2>Post not found</h2><p><a href="./">See all posts</a></p>';
                return;
            }
            const p = posts[idx];
            document.title = `${p.title} — AI Daily`;
            const res = await fetch(`posts/${encodeURIComponent(p.slug)}.md`, { cache: 'no-cache' });
            const md = res.ok ? await res.text() : '_Post content not found._';
            const newer = posts[idx - 1], older = posts[idx + 1];
            app.innerHTML = `
                <article class="post">
                    <div class="meta">${fmtDate(p.date)}</div>
                    <h1>${esc(p.title)}</h1>
                    <div>${tagsHtml(p.tags)}</div>
                    ${p.source?.title ? `<div class="source-box"><b>What I read:</b> ${p.source.url
                        ? `<a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.title)} <i class="fas fa-external-link-alt fa-xs"></i></a>`
                        : esc(p.source.title)}</div>` : ''}
                    <div class="post-body">${DOMPurify.sanitize(marked.parse(md))}</div>
                </article>
                <div class="post-nav">
                    <span>${older ? `<a href="?post=${encodeURIComponent(older.slug)}">← ${esc(older.title)}</a>` : ''}</span>
                    <span>${newer ? `<a href="?post=${encodeURIComponent(newer.slug)}">${esc(newer.title)} →</a>` : ''}</span>
                </div>`;
        }

        loadPosts()
            .then(posts => slug ? renderPost(posts) : renderList(posts))
            .catch(err => { app.innerHTML = `<p class="text-danger">Could not load posts: ${esc(err.message)}</p>`; });
    </script>
    <script src="../theme.js"></script>
</body>

</html>
